<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>function that print numbers from 10 to 1</title>
  </head>
  <body>
    <script>
      function reverse() {
        for (i = 10; i >= 1; i++) {
          console.log(i);
        }
      }
      reverse();
    </script>
  </body>
