<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>user input</title>
  </head>
  <body>
    <script>
      function greet() {
        return function () {
          let name = prompt("Enter Your Name:");
          document.write("Hello" + name);
        };
      }
      let result = greet();
      result();
    </script>
  </body>
</html>
