<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Celsius to fahrenheit</title>
  </head>
  <body>
    <script>
      function celsius() {
        return function (cel) {
          return (cel * 9) / 5 + 32;
        };
      }
      let result = celsius();
      document.write(result(100));
    </script>
  </body>
</html>
