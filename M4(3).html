<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Returning function from a function syntax</title>
</head>
<body>
    <script>
     function message()
     {
       return function()

     {
        console.log("Welcome");
     };

     }
    let show=message();
    show();

    </script>
   
</body>
</html>
