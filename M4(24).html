<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function simpleinterest() {
        return function (p, r, t) {
          return (p * r * t) / 100;
        };
      }
      let result = simpleinterest();
      document.write(result(1000, 4, 3));
    </script>
  </body>
</html>
