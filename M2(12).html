<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let a = parseInt(prompt("Enter the first number:"));
      let b = parseInt(prompt("Enter the second number:"));
      alert("Grether than:" + (a > b));
      alert("Less than:" + (a < b));
      alert("Greather than or equal:" + (a >= b));
      alert("Less than or equal:" + (a <= b));
    </script>
  </body>
</html>
