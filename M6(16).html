<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiply</title>
  </head>
  <body>
    <script>
      function multiplyBy(x) {
        return function (y) {
          return x * y;
        };
      }
      let result = multiplyBy(5);
      console.log(result(8));
    </script>
  </body>
</html>
