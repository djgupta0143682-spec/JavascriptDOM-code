<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Area of rectangle</title>
  </head>
  <body>
    <script>
      function area() {
        return function (a, b) {
          return a * b;
        };
      }
      let fun = area();
      console.log("Area of Rectangle:", fun(5, 6));
    </script>
  </body>
</html>
