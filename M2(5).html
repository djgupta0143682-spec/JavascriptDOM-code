<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modulus</title>
</head>
<body>
    <script language=javascript>
        let a=parseFloat(prompt("Enter the first number:"));
        let b=parseFloat(prompt("Enter the second number:"));
        let mod=a%b;
        alert("Remainder = " + mod);

    </script>
</body>
</html>
