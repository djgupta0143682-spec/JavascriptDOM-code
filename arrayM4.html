<!-- concat:joins two arrays -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>concat</title>
  </head>
  <body>
    <script>
      let boys = ["Rahul", "Amit"];
      let girls = ["Neha", "Priya"];
      let students = boys.concat(girls);
      document.write(students);
    </script>
  </body>
</html>
