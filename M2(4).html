<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Division</title>
</head>
<body>
    <script language=javascript>
        let a=parseFloat(prompt("Enter the first number:"));
