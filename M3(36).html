<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arrow function to find the square</title>
  </head>
  <body>
    <script>
      let square = (a) => {
        return a * a;
      };
      document.write(square(7));
    </script>
  </body>
</html>
