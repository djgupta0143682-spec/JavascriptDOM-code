<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arithmatic Operations</title>
  </head>
  <body>
    <script>
      function add(a, b) {
        return a + b;
      }

      function sub(a, b) {
        return a - b;
      }

      function mult(a, b) {
        return a * b;
      }

      function div(a, b) {
        return a / b;
      }

      function calculate(fun, a, b) {
        return fun * (a, b);
      }

      document.write(caculate(add(1, 2)));
      document.write(caculate(sub(11, 22)));
      document.write(caculate(mult(17, 28)));
      document.write(caculate(div(11, 21)));
    </script>
  </body>
</html>
