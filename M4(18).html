<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function areaofcircle() {
        const pi = 3.14;
        return function (r) {
          return pi * r * r;
        };
      }
      let fun = areaofcircle();
      console.log("Area of circle:", fun(5));
    </script>
  </body>
</html>
